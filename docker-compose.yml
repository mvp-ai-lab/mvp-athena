services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena}
      POSTGRES_DB: ${POSTGRES_DB:-athena}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./docs/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - "${ATHENA_API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ATHENA_STORAGE_MODE: postgres
      ATHENA_TOKEN: ${ATHENA_TOKEN:-}
      ATHENA_DEFAULT_USER_ID: ${ATHENA_DEFAULT_USER_ID:-dev-user}
      ATHENA_TRUSTED_USER_HEADER: ${ATHENA_TRUSTED_USER_HEADER:-false}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GITHUB_OWNER: ${GITHUB_OWNER:?GITHUB_OWNER is required}
      GITHUB_REPO: ${GITHUB_REPO:?GITHUB_REPO is required}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      ATHENA_SIGNUP_SPACE_ID: ${ATHENA_SIGNUP_SPACE_ID:-}
      ATHENA_SIGNUP_ROLE: ${ATHENA_SIGNUP_ROLE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  discord-bot:
    profiles: ["discord"]
    build:
      context: .
      target: discord-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATHENA_API_URL: http://api:3000
      ATHENA_TOKEN: ${ATHENA_TOKEN:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

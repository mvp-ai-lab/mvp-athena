services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena}
      POSTGRES_DB: ${POSTGRES_DB:-athena}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - "${ATHENA_API_BIND:-}${ATHENA_API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ATHENA_STORAGE_MODE: postgres
      ATHENA_BODY_LIMIT_BYTES: ${ATHENA_BODY_LIMIT_BYTES:-10485760}
      ATHENA_API_TOKEN_TTL_DAYS: ${ATHENA_API_TOKEN_TTL_DAYS:-30}
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ATHENA_SIGNUP_SPACE_ID: ${ATHENA_SIGNUP_SPACE_ID:-}
      ATHENA_SIGNUP_ROLE: ${ATHENA_SIGNUP_ROLE:-}
    secrets:
      - source: github_app_private_key
        target: github-app.pem
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  discord-bot:
    profiles: ["discord"]
    build:
      context: .
      target: discord-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATHENA_API_URL: http://api:3000
      ATHENA_BOT_TOKEN: ${ATHENA_BOT_TOKEN:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:

secrets:
  github_app_private_key:
    file: ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-./.secrets/github-app.pem}
